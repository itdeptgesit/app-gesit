
[functions.send-helpdesk-alert]
enabled = true
verify_jwt = true
import_map = "./functions/send-helpdesk-alert/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/send-helpdesk-alert/index.ts"

[functions.manage-user]
enabled = true
verify_jwt = true
entrypoint = "./functions/manage-user/index.ts"

[functions.tv-launcher-api]
enabled = true
verify_jwt = false
entrypoint = "./functions/tv-launcher-api/index.ts"

